name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - copilot-conventions

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint repository conventions
        run: npm run lint

      - name: Build angularstart-todo
        run: npm run build -w angularstart-todo --if-present

      - name: Test angularstart-todo
        run: npm run test -w angularstart-todo --if-present
