name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - copilot-conventions

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install angularstart-todo dependencies
        run: npm --prefix angularstart-todo ci --legacy-peer-deps

      - name: Lint repository conventions
        run: npm run lint --if-present

      - name: Lint angularstart-todo
        run: npm --prefix angularstart-todo run lint --if-present

      - name: Build angularstart-todo
        run: npm --prefix angularstart-todo run build --if-present

      - name: Test angularstart-todo
        run: npm --prefix angularstart-todo run test --if-present -- --watch=false --browsers=ChromeHeadless
